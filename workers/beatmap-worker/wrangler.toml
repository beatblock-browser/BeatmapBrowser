name = "beatmap-worker"
main = "index.js"
compatibility_date = "2025-03-25"

[build]
command = "cargo install -q worker-build && worker-build --release"

[vars]
JWT_SECRET = "change-me-in-prod"
R2_PUBLIC_URL = "https://example.r2.cloudflarestorage.com/your-bucket"

[[d1_databases]]
binding = "beatblockbrowser"
database_name = "beatblockbrowser"
# Set your production database_id after creating it: wrangler d1 create beatmapbrowser
database_id = "07ef0b59-6909-4153-9e58-7c2bc6dd4d1a"
# Migrating: npx wrangler d1 migrations apply beatmapbrowser --local
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAPS"
bucket_name = "beatmap-maps"
preview_bucket_name = "beatmap-maps-dev"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

