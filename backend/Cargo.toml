[package]
name = "backend"
version = "2.0.0"
edition = "2024"

build = "build.rs"
[dependencies]
# Web traffic
actix-web = "4.10.2"
actix-governor = "0.8.0"
actix-files = "0.6.6"
jsonwebtoken = "9.3.1"

tokio = { version = "1.40.0", features = ["full"] }

# Util
futures = "0.3.31"
linked_hash_set = "0.1.4"
bytes = "1.8.0"

# Error handling
thiserror = "1.0.63"
anyhow = "1.0.89"

# File formats
zip = { version = "2.2.0", features = [] }
unrar = "0.5.6"
image = "0.25.2"

# Database
firebase-auth = { version = "0.4.3", default-features = false }
uuid = { version = "1.10.0", features = ["v4", "serde", "fast-rng", "macro-diagnostics"] }
mongodb = "3.2.0"

# Serialization
serde = { version = "1.0.219", features = ["derive"] }
bson = { version = "2.13.0", features = ["serde_with-3", "uuid-1", "chrono-0_4"] }
serde_urlencoded = "0.7.1"
serde_json = "1.0"
chrono = { version = "0.4.38", features = ["serde"] }

# Discord
serenity = { git = "https://github.com/Serenity-rs/serenity", branch = "next" }
env_logger = "0.11.7"
log = "0.4.22"

[build-dependencies]
anyhow = "1.0.89"
typebinder = { git = "https://github.com/impero-com/typebinder" }
regex = "1.11.1"